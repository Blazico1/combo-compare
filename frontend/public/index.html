<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combo Compare</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Ensure React Refresh preamble hooks exist to avoid runtime errors
         when the dev plugin injects HMR code but the preamble isn't present
         (this can happen in some dev environments). These no-op stubs are
         harmless in production and allow the app to load. -->
    <script>
      if (!window.$RefreshReg$) window.$RefreshReg$ = function() {};
      if (!window.$RefreshSig$) window.$RefreshSig$ = function() { return function() {}; };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
