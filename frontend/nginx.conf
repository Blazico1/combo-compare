server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app under the path /combo-compare/
    location /combo-compare/ {
        # Map requests under /combo-compare/ to the files produced in /usr/share/nginx/html
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /combo-compare/index.html;
    }

    # Proxy API requests that live under /combo-compare/api/ to the backend service
    location /combo-compare/api/ {
        rewrite ^/combo-compare/api/(.*)$ /api/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also accept plain /api/ paths so browser requests to /api/ (root) work
    # This helps when the app is served at /combo-compare/ but still issues
    # requests to absolute /api/... URLs (e.g., during development).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }
}
