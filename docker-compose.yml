services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173
    ports:
      - '8000:8000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - '3000:80'
    restart: unless-stopped
