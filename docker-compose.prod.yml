services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: combo-compare-backend:prod
    env_file: .env
    ports:
      - '127.0.0.1:8000:8000'

  frontend:
    image: combo-compare-frontend:prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"
    env_file: .env
