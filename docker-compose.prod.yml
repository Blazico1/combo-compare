version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: combo-compare-backend:prod
    env_file: .env
    ports:
      - '8000:8000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: combo-compare-frontend:prod
    depends_on:
      - backend
    ports:
      - '80:80'
